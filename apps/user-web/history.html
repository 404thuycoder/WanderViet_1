<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử & Hoạt động - WanderViệt</title>
  <link rel="icon" type="image/png" href="/assets/wanderviet-logo-cropped-rounded.png">
  <link rel="stylesheet" href="css/global-tokens.css?v=6.0">
  <link rel="stylesheet" href="css/styles.css?v=6.0">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --hist-radius: 24px; }
    body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); margin: 0; }

    /* ── Hero ── */
    .hero { background: linear-gradient(135deg, #e0e7ff 0%, #ffffff 100%); padding: 100px 20px 60px; text-align: center; transition: background 0.3s; }
    .hero h1 { font-size: 3.2rem; font-weight: 800; margin: 0 0 30px; color: var(--text); letter-spacing: -2px; }
    .hero-search { max-width: 600px; margin: 0 auto; background: var(--bg-elevated); border-radius: 100px; box-shadow: var(--shadow-sm); padding: 5px; display: flex; align-items: center; border: 1px solid var(--border); }
    .hero-search input { flex: 1; border: none; padding: 15px 25px; font-size: 1rem; font-weight: 600; outline: none; border-radius: 100px; background: transparent; color: var(--text); }
    .hero-search button { background: var(--primary, #6366f1); color: #fff; border: none; padding: 12px 30px; border-radius: 100px; font-weight: 700; cursor: pointer; }

    /* ── Layout ── */
    .dashboard { max-width: 1500px; margin: 0 auto; padding: 40px; display: grid; grid-template-columns: 300px 1fr; gap: 40px; }

    /* ── Sidebar ── */
    .sidebar-wrapper { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 20px; }
    .sidebar-card { background: var(--bg-elevated); border-radius: var(--hist-radius); padding: 25px 15px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .sb-label { font-size: 0.7rem; font-weight: 800; color: var(--text-secondary, #94a3b8); text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px 15px; }
    .sb-label:first-child { margin-top: 0; }
    
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 16px; color: var(--text-muted); font-weight: 700; cursor: pointer; transition: 0.2s; position: relative; font-size: 0.9rem; }
    .nav-item:hover { background: rgba(99,102,241,0.06); color: var(--text); }
    .nav-item.is-active { background: var(--primary, #6366f1); color: #fff; box-shadow: 0 10px 20px rgba(99,102,241,0.2); }
    .nav-count { margin-left: auto; font-size: 0.75rem; font-weight: 800; opacity: 0.8; }
    .dot-alert { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: none; animation: p 1.5s infinite; }
    @keyframes p { 0%, 100% { opacity:1; } 50% { opacity:0.3; } }

    /* ── Dynamic Filters in Sidebar ── */
    .sb-filter-group { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border); }
    .sb-filter-list { display: flex; flex-direction: column; gap: 5px; }
    .sb-filter-item { padding: 8px 18px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
    .sb-filter-item:hover { background: rgba(99,102,241,0.06); color: var(--primary, #6366f1); }
    .sb-filter-item.active { color: var(--primary, #6366f1); background: rgba(99,102,241,0.08); font-weight: 800; }

    /* ── Main Area ── */
    .content-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
    .top-left h2 { font-size: 2rem; font-weight: 800; margin: 0 0 5px; letter-spacing: -1px; color: var(--text); }
    .top-left p { color: var(--text-muted); font-weight: 600; font-size: 0.9rem; margin: 0; }
    
    .stats-row { display: flex; gap: 15px; }
    .stat-mini { background: var(--bg-elevated); padding: 15px 25px; border-radius: 18px; border: 1px solid var(--border); text-align: center; }
    .stat-val { display: block; font-size: 1.3rem; font-weight: 800; color: var(--text); }
    .stat-lb { font-size: 0.65rem; font-weight: 800; color: var(--text-secondary, #94a3b8); text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Grid & Timeline ── */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
    .v-card { background: var(--bg-elevated); border-radius: var(--hist-radius); overflow: hidden; box-shadow: var(--shadow-sm); transition: 0.3s; border: 1px solid var(--border); }
    .v-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-md, 0 15px 30px rgba(0,0,0,0.1)); }
    .v-img-wrap { height: 200px; position: relative; }
    .v-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .v-badge-top { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); color:#fff; padding:5px 12px; border-radius:8px; font-weight:800; font-size:0.8rem; }
    .v-status-tag { position: absolute; top: 12px; left: 12px; padding: 5px 12px; border-radius: 8px; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; color:#fff; }
    .tag-info { background: #3b82f6; } .tag-warn { background: #f59e0b; } .tag-ok { background: #10b981; } .tag-err { background: #ef4444; }

    .v-body { padding: 20px; }
    .v-cat { font-size: 0.65rem; font-weight: 800; color: var(--primary, #6366f1); text-transform: uppercase; margin-bottom: 5px; }
    .v-title { font-size: 1.15rem; font-weight: 800; margin: 0 0 10px; color: var(--text); line-height: 1.4; }
    .v-meta { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; display: flex; gap: 12px; }
    .v-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

    /* ── Timeline ── */
    .timeline { position: relative; padding-left: 40px; }
    .timeline::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--border); }
    .act-log { position: relative; margin-bottom: 25px; }
    .act-dot { position: absolute; left: -36px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg-elevated); border: 3px solid var(--primary, #6366f1); z-index: 2; }
    .act-info { background: var(--bg-elevated); padding: 15px 20px; border-radius: 18px; border: 1px solid var(--border); }
    .act-time { font-size: 0.75rem; font-weight: 800; color: var(--text-secondary, #94a3b8); margin-bottom: 4px; }
    .act-txt { font-weight: 700; font-size: 0.95rem; color: var(--text); margin: 0; }

    .empty-box { text-align: center; padding: 80px 0; color: var(--text-secondary, #94a3b8); grid-column: 1/-1; font-weight: 600; }

    /* ── Dark Mode Hero Override ── */
    [data-theme="dark"] .hero { background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #040914 100%); }
    [data-theme="dark"] .hero-search { box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    [data-theme="dark"] .nav-item:hover { background: rgba(129,140,248,0.1); }
    [data-theme="dark"] .sb-filter-item:hover { background: rgba(129,140,248,0.1); }
    [data-theme="dark"] .sb-filter-item.active { background: rgba(129,140,248,0.12); }
    [data-theme="dark"] .v-card:hover { box-shadow: 0 15px 30px rgba(0,0,0,0.4); }

    @media (max-width: 1100px) { .dashboard { grid-template-columns: 1fr; } .sidebar-wrapper { position: static; } .stats-row { flex-direction: column; } }
  </style>
</head>
<body>
  <header id="header-container"></header>

  <section class="hero">
    <h1>WanderViệt<br>Lịch sử & Hoạt động</h1>
    <div class="hero-search">
      <input type="text" id="search-input" placeholder="Tìm kiếm nhanh đơn hàng hoặc hoạt động...">
      <button onclick="renderList()">Tìm kiếm</button>
    </div>
  </section>

  <div class="dashboard">
    <aside class="sidebar-wrapper">
      <div class="sidebar-card">
        <div class="sb-label">Danh mục chính</div>
        <div class="nav-item is-active" data-tab="wishlist">
          <span>❤️</span> <span>Yêu thích</span> <span class="nav-count" id="count-wishlist">0</span>
        </div>
        <div class="nav-item" data-tab="bookings">
          <span>🏨</span> <span>Đặt chỗ</span> <span class="nav-count" id="count-bookings">0</span>
          <div class="dot-alert" id="pending-dot"></div>
        </div>
        <div class="nav-item" data-tab="rentals">
          <span>🚗</span> <span>Thuê xe</span> <span class="nav-count" id="count-rentals">0</span>
        </div>
        <div class="nav-item" data-tab="trips">
          <span>🎒</span> <span>Hành trình AI</span> <span class="nav-count" id="count-trips">0</span>
        </div>
        <div class="nav-item" data-tab="transactions">
          <span>💰</span> <span>Giao dịch</span> <span class="nav-count" id="count-txns">0</span>
        </div>
        <div class="nav-item" data-tab="activities">
          <span>🕒</span> <span>Hoạt động</span> <span class="nav-count" id="count-acts">0</span>
        </div>

        <!-- Bộ lọc linh hoạt sẽ hiện ở đây -->
        <div id="dynamic-filters"></div>
      </div>
    </aside>

    <main>
      <div class="content-top">
        <div class="top-left">
          <h2 id="tab-title">Yêu thích</h2>
          <p>Khám phá <strong id="result-count-val">0</strong> kết quả lịch sử của bạn</p>
        </div>
        <div class="stats-row">
          <div class="stat-mini">
            <span class="stat-val" id="stat-spent">0đ</span>
            <span class="stat-lb">Tổng chi tiêu</span>
          </div>
          <div class="stat-mini">
            <span class="stat-val" id="stat-trips">0</span>
            <span class="stat-lb">Chuyến đi</span>
          </div>
          <div class="stat-mini">
            <span class="stat-val" id="stat-places">0</span>
            <span class="stat-lb">Điểm đến</span>
          </div>
        </div>
      </div>

      <div id="list-area"></div>
    </main>
  </div>

  <footer id="footer-container"></footer>

  <script src="js/SharedUI.js?v=6.0"></script>
  <script src="js/places-data.js"></script>
  <script src="js/history.js?v=6.1"></script>
  <script>
    (function() {
      // Sync theme from documentElement to body for local overrides
      const syncTheme = () => {
        const theme = document.documentElement.getAttribute('data-theme') || 'dark';
        document.body.setAttribute('data-theme', theme);
      };
      const themeObserver = new MutationObserver(syncTheme);
      themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      syncTheme();
    })();
  </script>
</body>
</html>
