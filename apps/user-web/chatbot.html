<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- WanderViet Translation Curtain -->
    <script>
      if (document.cookie.match(/googtrans=\/vi\/(?!vi)[a-zA-Z-]+/)) {
        document.documentElement.classList.add('translating-curtain');
      }
    </script>
    <style>
      html.translating-curtain::before {
        content: "Translating Experience...";
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #0f172a; color: #f1f5f9;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999999; font-family: sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 1px;
      }
      html.translating-curtain body {
        opacity: 0 !important;
        pointer-events: none !important;
      }
      html.translated-ltr::before, html.translated-rtl::before {
        display: none !important;
      }
      html.translated-ltr body, html.translated-rtl body {
        opacity: 1 !important;
        pointer-events: auto !important;
        transition: opacity 0.4s ease;
      }
    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WanderViệt — AI Assistant Fullscreen</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="global-tokens.css?v=1778466754685" />
    <link rel="stylesheet" href="styles.css?v=1778466754685" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
</head>
<body class="fullscreen-chat-body">
    <header class="site-header" id="header-container" style="position: fixed; top: 0; left: 0; right: 0; z-index: 1000;"></header>
    
    <div style="margin-top: 60px; padding: 20px; text-align: center;">
        <h2 style="color: var(--text-muted);">Đang khởi tạo Trợ lý AI...</h2>
        <p>Nếu khung chat không tự động mở, vui lòng nhấn vào biểu tượng tin nhắn ở góc dưới.</p>
    </div>

    <!-- The chatbot is injected and managed by SharedUI.js -->
    <script src="SharedUI.js?v=1778469567315"></script>
</body>
</html>
