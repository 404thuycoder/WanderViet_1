    <!-- WanderViet Translation Curtain -->
    <script>
      if (document.cookie.match(/googtrans=\/vi\/(?!vi)[a-zA-Z-]+/)) {
        document.documentElement.classList.add('translating-curtain');
      }
    </script>
    <style>
      html.translating-curtain::before {
        content: "Translating Experience...";
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #0f172a; color: #f1f5f9;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999999; font-family: sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 1px;
      }
      html.translating-curtain body {
        opacity: 0 !important;
        pointer-events: none !important;
      }
      html.translated-ltr::before, html.translated-rtl::before {
        display: none !important;
      }
      html.translated-ltr body, html.translated-rtl body {
        opacity: 1 !important;
        pointer-events: auto !important;
        transition: opacity 0.4s ease;
      }
    </style>

    <title>Danh bạ Dịch vụ — WanderViệt</title>
    <link rel="icon" type="image/png" href="/assets/wanderviet-logo-cropped-rounded.png">

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg-system: #060912;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        html[data-theme="light"] body {
            --bg-system: #f8fafc;
            --text-main: #0f172a;
            --text-dim: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg-system); color: var(--text-main); margin: 0; transition: background 0.4s; overflow-x: hidden; }

        .hero-lite { padding: 100px 20px 60px; text-align: center; background: radial-gradient(circle at 50% 0%, rgba(99,102,241,0.15), transparent 70%); }
        .hero-title { font-family: 'Plus Jakarta Sans'; font-size: 3.5rem; font-weight: 800; letter-spacing: -2px; margin: 0; line-height: 1; }

        .search-bar {
            max-width: 720px; margin: 40px auto 0; background: var(--glass-bg);
            backdrop-filter: blur(30px); border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 24px; display: flex; gap: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }
        .search-bar input { flex: 1; background: transparent; border: none; padding: 12px 24px; color: var(--text-main); font-size: 1rem; outline: none; }
        .btn-search { background: var(--primary); color: #fff; border: none; padding: 0 32px; border-radius: 18px; font-weight: 700; cursor: pointer; }

        .layout { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 320px 1fr; gap: 50px; padding: 50px; }
        
        .side-panel { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 36px; padding: 32px; 
            position: sticky; top: 120px; align-self: start;
            max-height: calc(100vh - 160px); overflow-y: auto;
        }
        .side-panel::-webkit-scrollbar { width: 4px; }
        .side-panel::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        
        .filter-header { font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
        .filter-group { border-bottom: 1px solid var(--glass-border); padding-bottom: 24px; margin-bottom: 24px; }
        .filter-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .filter-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        
        .f-item {
            display: flex; align-items: center; gap: 12px; cursor: pointer; color: var(--text-dim); margin-bottom: 14px; font-size: 14px; user-select: none; transition: 0.2s;
        }
        .f-item:hover { color: var(--text-main); }
        .f-item:active .f-checkbox { transform: scale(0.9); }
        .f-item:last-child { margin-bottom: 0; }
        
        .f-checkbox {
            width: 22px; height: 22px; border: 2px solid var(--glass-border); border-radius: 6px; 
            display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255,255,255,0.02); flex-shrink: 0;
        }
        .f-checkbox svg { 
            width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; 
            stroke-dasharray: 24; stroke-dashoffset: 24; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .f-item.active .f-checkbox { background: var(--primary); border-color: var(--primary); box-shadow: 0 4px 10px rgba(99,102,241,0.3); }
        .f-item.active .f-checkbox svg { stroke-dashoffset: 0; }
        .f-item.active { color: var(--text-main); font-weight: 700; }
        
        .f-count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--text-dim); background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 2px 8px; border-radius: 12px; transition: 0.3s; }
        .f-item.active .f-count { background: var(--primary); color: #fff; border-color: var(--primary); }

        .sub-input {
            width: 100%; background: var(--bg-system); border: 1px solid var(--glass-border); 
            border-radius: 12px; padding: 12px 16px; color: var(--text-main); font-size: 13px;
            margin-bottom: 12px; outline: none; transition: 0.3s; box-sizing: border-box; font-family: inherit;
        }
        .sub-input::placeholder { color: var(--text-dim); }
        .sub-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        
        .price-operator { display: flex; gap: 8px; }
        .po-btn { 
            flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); 
            color: var(--text-dim); padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; 
            cursor: pointer; transition: 0.2s; 
        }
        .po-btn:hover { background: rgba(255,255,255,0.08); }
        .po-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(99,102,241,0.2); }

        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }

        /* ELITE SERVICE CARD */
        .svc-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 32px;
            overflow: hidden; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; position: relative;
        }
        .svc-card:hover { transform: translateY(-12px); border-color: var(--primary); box-shadow: 0 30px 60px rgba(0,0,0,0.2); }
        .svc-img { height: 230px; position: relative; }
        .svc-img img { width: 100%; height: 100%; object-fit: cover; }
        .svc-price { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 12px; color: #fff; font-weight: 800; font-size: 13px; }

        .svc-info { padding: 28px; }
        .svc-cat { color: var(--primary); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; display: block; }
        .svc-name { font-size: 1.4rem; font-weight: 800; margin: 0 0 12px; color: var(--text-main); line-height: 1.3; }

        /* BIZ CHANNEL CARD */
        .biz-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 40px;
            padding: 40px; margin-bottom: 32px; transition: 0.4s; position: relative;
            grid-column: span 3; display: grid; grid-template-columns: 120px 1fr; gap: 40px;
        }
        .biz-logo { width: 120px; height: 120px; border-radius: 28px; border: 3px solid var(--primary); object-fit: cover; }
        .biz-ecosystem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
        .eco-item { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 20px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; }
        .eco-item:hover { background: rgba(99,102,241,0.1); border-color: var(--primary); }
        .eco-item img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }

        .toggle-switch { display: flex; background: var(--glass-bg); padding: 6px; border-radius: 20px; border: 1px solid var(--glass-border); }
        .tg-btn { border: none; background: transparent; padding: 12px 28px; border-radius: 14px; color: var(--text-dim); font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .tg-btn.active { background: var(--primary); color: #fff; box-shadow: 0 10px 20px rgba(99,102,241,0.2); }

        /* CUSTOM PREMIUM SELECT */
        .custom-select { position: relative; width: 220px; }
        .select-trigger {
            background: var(--primary); color: #fff; padding: 12px 24px; border-radius: 18px;
            font-weight: 800; font-size: 13px; cursor: pointer; display: flex;
            justify-content: space-between; align-items: center; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(99,102,241,0.2);
        }
        .select-trigger:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99,102,241,0.3); }
        .select-options {
            position: absolute; top: calc(100% + 10px); right: 0; width: 100%;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            overflow: hidden; display: none; z-index: 1000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }
        .select-options.show { display: block; }
        .option { padding: 14px 20px; font-size: 13px; font-weight: 600; color: var(--text-main); cursor: pointer; transition: 0.2s; }
        .option:hover { background: rgba(99,102,241,0.1); color: var(--primary); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

    <script>
        const observer = new MutationObserver(() => {
            const t = document.documentElement.getAttribute('data-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        let rawData = [], filterCats = new Set(), filterAddrs = new Set(), filterPrices = new Set(), channel = 'svc', sortBy = 'pop';
        let customAddr = '', customPriceVal = 0, priceOperator = 'less';

        async function init() {
            try {
                const r = await fetch('/api/public/all-places');
                const j = await r.json();
                if(!j.success) return;
                // Chỉ hiển thị các địa điểm được quản lý bởi doanh nghiệp
                rawData = j.data.filter(p => p.ownerId);
                updateStats();
                syncFilters();
            } catch(e) {}
        }

        function isMatch(p, cats) {
            if (cats.size === 0) return true;
            const k = (p.kind || '').toLowerCase();
            const c = (p.category || '').toLowerCase();
            const n = (p.name || '').toLowerCase();
            
            for (let cat of cats) {
                if (cat === 'Khách sạn' && (k === 'khach-san' || c.includes('khách sạn') || c.includes('resort') || c.includes('hotel') || n.includes('khách sạn') || n.includes('resort'))) return true;
                if (cat === 'Tour' && (p.isTour || k === 'trai-nghiem' || k === 'diem-du-lich' || c.includes('tour') || c.includes('trải nghiệm') || n.includes('tour') || n.includes('trải nghiệm'))) return true;
                if (cat === 'Ẩm thực' && (k === 'nha-hang' || k === 'giai-tri' || c.includes('ẩm thực') || c.includes('nhà hàng') || c.includes('dining') || n.includes('nhà hàng') || n.includes('quán ăn') || c.includes('ăn uống'))) return true;
                if (cat === 'Văn hóa' && (c.includes('văn hóa') || c.includes('bảo tàng') || c.includes('nghệ thuật') || n.includes('bảo tàng'))) return true;
                if (cat === 'Thiên nhiên' && (c.includes('thiên nhiên') || c.includes('ngoài trời') || c.includes('công viên') || n.includes('vườn') || n.includes('thiên nhiên'))) return true;
                if (cat === 'Giải trí' && (k === 'giai-tri' || c.includes('giải trí') || c.includes('vé') || n.includes('công viên nước') || n.includes('khu vui chơi'))) return true;
            }
            return false;
        }

        function updateStats() {
            document.getElementById('cnt-all').innerText = rawData.length;
            document.getElementById('cnt-hotel').innerText = rawData.filter(p => isMatch(p, new Set(['Khách sạn']))).length;
            document.getElementById('cnt-tour').innerText = rawData.filter(p => isMatch(p, new Set(['Tour']))).length;
            document.getElementById('cnt-food').innerText = rawData.filter(p => isMatch(p, new Set(['Ẩm thực']))).length;
            document.getElementById('cnt-culture').innerText = rawData.filter(p => isMatch(p, new Set(['Văn hóa']))).length;
            document.getElementById('cnt-nature').innerText = rawData.filter(p => isMatch(p, new Set(['Thiên nhiên']))).length;
            document.getElementById('cnt-ent').innerText = rawData.filter(p => isMatch(p, new Set(['Giải trí']))).length;
        }

        function setCustomAddr(val) {
            customAddr = val;
            if(val.trim() !== '') {
                filterAddrs.clear();
                document.querySelectorAll('#addr-list .f-item').forEach(i => i.classList.remove('active'));
                document.querySelector('#addr-list .f-item[onclick*="\'all\'"]')?.classList.add('active');
            }
            syncFilters();
        }

        function setCustomPrice(val) {
            customPriceVal = Number(val) || 0;
            if(customPriceVal > 0) {
                filterPrices.clear();
                // We shouldn't target all elements in price-list since there are labels inside
                document.querySelectorAll('#price-list > label.f-item').forEach(i => i.classList.remove('active'));
                document.querySelector('#price-list > label.f-item[onclick*="\'all\'"]')?.classList.add('active');
            }
            syncFilters();
        }

        function setPriceOperator(op) {
            priceOperator = op;
            document.getElementById('po-less').classList.toggle('active', op === 'less');
            document.getElementById('po-greater').classList.toggle('active', op === 'greater');
            syncFilters();
        }

        function setFilter(type, val, el) {
            const listId = type === 'cat' ? 'cat-list' : type === 'addr' ? 'addr-list' : 'price-list';
            const stateSet = type === 'cat' ? filterCats : type === 'addr' ? filterAddrs : filterPrices;

            if (type === 'addr' && customAddr !== '') {
                document.getElementById('custom-addr').value = '';
                customAddr = '';
            }
            if (type === 'price' && customPriceVal > 0) {
                document.getElementById('custom-price').value = '';
                customPriceVal = 0;
            }

            if (val === 'all') {
                stateSet.clear();
                document.querySelectorAll(`#${listId} .f-item`).forEach(i => i.classList.remove('active'));
                el.classList.add('active');
            } else {
                if (stateSet.has(val)) {
                    stateSet.delete(val);
                    el.classList.remove('active');
                } else {
                    stateSet.add(val);
                    el.classList.add('active');
                }
                
                const allBtn = document.querySelector(`#${listId} .f-item[onclick*="'all'"]`);
                if (stateSet.size > 0) {
                    allBtn.classList.remove('active');
                } else {
                    allBtn.classList.add('active');
                }
            }
            syncFilters();
        }

        function resetAllFilters() {
            filterCats.clear();
            filterAddrs.clear();
            filterPrices.clear();
            
            customAddr = '';
            customPriceVal = 0;
            priceOperator = 'less';
            
            document.getElementById('mainSearch').value = '';
            document.getElementById('custom-addr').value = '';
            document.getElementById('custom-price').value = '';
            document.getElementById('po-less').classList.add('active');
            document.getElementById('po-greater').classList.remove('active');

            document.querySelectorAll('.side-panel .f-item').forEach(i => i.classList.remove('active'));
            document.querySelector('#cat-list .f-item[onclick*="\'all\'"]')?.classList.add('active');
            document.querySelector('#price-list > label.f-item[onclick*="\'all\'"]')?.classList.add('active');
            document.querySelector('#addr-list .f-item[onclick*="\'all\'"]')?.classList.add('active');
            syncFilters();
        }

        function switchChannel(ch) {
            channel = ch;
            document.getElementById('btn-svc').classList.toggle('active', ch==='svc');
            document.getElementById('btn-biz').classList.toggle('active', ch==='biz');
            syncFilters();
        }

        function toSearchStr(str) {
            if (!str) return '';
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function syncFilters() {
            let list = rawData;
            const q = toSearchStr(document.getElementById('mainSearch').value);
            
            if(q) {
                list = list.filter(p => 
                    toSearchStr(p.name).includes(q) || 
                    toSearchStr(p.ownerName).includes(q) || 
                    toSearchStr(p.address).includes(q) || 
                    toSearchStr(p.region).includes(q)
                );
            }
            
            if(filterCats.size > 0) list = list.filter(p => isMatch(p, filterCats));
            
            if(customAddr.trim() !== '') {
                const searchAddr = toSearchStr(customAddr);
                list = list.filter(p => toSearchStr(p.address).includes(searchAddr) || toSearchStr(p.region).includes(searchAddr));
            } else if(filterAddrs.size > 0) {
                list = list.filter(p => {
                    for (let addr of filterAddrs) {
                        if ((p.address||'').includes(addr)) return true;
                    }
                    return false;
                });
            }
            
            if(customPriceVal > 0) {
                list = list.filter(p => {
                    const pr = p.price || p.priceFrom || 0;
                    if (priceOperator === 'less') return pr <= customPriceVal;
                    if (priceOperator === 'greater') return pr >= customPriceVal;
                    return true;
                });
            } else if(filterPrices.size > 0) {
                list = list.filter(p => {
                    const pr = p.price || p.priceFrom || 0;
                    for (let priceRange of filterPrices) {
                        const [min, max] = priceRange.split('-').map(Number);
                        if (pr >= min && pr <= max) return true;
                    }
                    return false;
                });
            }

            if(sortBy === 'low') list.sort((a,b) => (a.price||a.priceFrom||0) - (b.price||b.priceFrom||0));
            if(sortBy === 'high') list.sort((a,b) => (b.price||b.priceFrom||0) - (a.price||a.priceFrom||0));

            if(channel === 'biz') renderBiz(list); else renderSvc(list);
            document.getElementById('total-count').innerText = (channel === 'biz') ? Object.keys(groupByOwner(list)).length : list.length;
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('sort-options').classList.toggle('show');
        }

        function selectSort(val, label) {
            sortBy = val;
            document.getElementById('selected-sort').innerText = label;
            document.getElementById('sort-options').classList.remove('show');
            syncFilters();
        }

        window.addEventListener('click', () => {
            document.getElementById('sort-options')?.classList.remove('show');
        });

        function groupByOwner(data) {
            const groups = {};
            data.forEach(p => {
                const ownerName = p.ownerName || p.name || 'WanderViệt Partner';
                const ownerId = p.ownerId || p._id || p.id;
                const hasRealBiz = p.hasRealBusiness !== undefined ? p.hasRealBusiness : (p.ownerId !== p._id);
                if(!groups[ownerName]) groups[ownerName] = { 
                    name: ownerName, 
                    id: ownerId, 
                    places: [],
                    hasRealBusiness: hasRealBiz,
                    businessData: p.businessData
                };
                // Ensure if any place in the group has real business, the group has it
                if (hasRealBiz) groups[ownerName].hasRealBusiness = true;
                groups[ownerName].places.push(p);
            });
            return groups;
        }

        // ... [renderSvc is unchanged below] ...

        function renderSvc(data) {
            if(data.length === 0) {
                document.getElementById('display-grid').innerHTML = `
                    <div style="grid-column:span 3; padding:100px; text-align:center;">
                        <div style="font-size: 50px; margin-bottom: 20px;">🔍</div>
                        <h3 style="color:var(--text-main); margin-bottom: 10px;">Không tìm thấy dịch vụ nào</h3>
                        <p style="color:var(--text-dim); margin-bottom: 30px;">Thử thay đổi bộ lọc hoặc chọn địa điểm khác nhé.</p>
                        <button class="btn-search" onclick="resetAllFilters()" style="padding: 12px 30px;">Xóa tất cả bộ lọc</button>
                    </div>
                `;
                return;
            }
            document.getElementById('display-grid').innerHTML = data.map(p => {
                let fallbackImg = 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&q=80';
                if (p.kind === 'khach-san') fallbackImg = 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600&q=80';
                else if (p.kind === 'nha-hang' || p.kind === 'giai-tri') fallbackImg = 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&q=80';
                else if (p.isTour || p.kind === 'trai-nghiem') fallbackImg = 'https://images.unsplash.com/photo-1533130061792-64b345e4a833?w=600&q=80';
                const imgUrl = (p.images && p.images[0] && p.images[0].length > 5) ? p.images[0] : (p.image && p.image.length > 5 ? p.image : fallbackImg);
                
                return `
                <div class="svc-card" onclick="window.location.href='place-detail.html?id=${p._id || p.id}'">
                    <div class="svc-img"><img src="${imgUrl}" onerror="this.onerror=null;this.src='${fallbackImg}';"><div class="svc-price">${(p.price || p.priceFrom || 0).toLocaleString('vi-VN')} ₫</div></div>
                    <div class="svc-info">
                        <span class="svc-cat">${p.category || (p.kind === 'khach-san' ? 'Lưu trú Elite' : (p.isTour || p.kind === 'trai-nghiem') ? 'Trải nghiệm Tour' : (p.kind === 'nha-hang' || p.kind === 'giai-tri') ? 'Ẩm thực & Giải trí' : 'Trải nghiệm')}</span>
                        <h3 class="svc-name">${p.name}</h3>
                        <div style="display:flex; gap:16px; font-size:12px; color:var(--text-dim);"><span>⭐ ${p.rating || '5.0'}</span><span>📍 ${(p.address||'').split(',').pop().trim()}</span></div>
                        <div style="margin-top:20px; padding-top:20px; border-top:1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:center;">
                            <div style="display:flex; align-items:center; gap:8px;"><img src="https://ui-avatars.com/api/?name=${encodeURIComponent(p.ownerName||'WV')}&background=6366f1&color=fff" style="width:24px; height:24px; border-radius:6px;"> <span style="font-size:11px; font-weight:700; color:var(--text-dim);">${p.ownerName||'WanderViệt Partner'}</span></div>
                            <span style="color:var(--primary); font-size:9px; font-weight:800;">VERIFIED 🛡️</span>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function renderBiz(data) {
            const groups = groupByOwner(data);
            const owners = Object.values(groups).filter(g => g.hasRealBusiness);
            
            if(owners.length === 0) {
                document.getElementById('display-grid').innerHTML = `<div style="grid-column:span 3; padding:100px; text-align:center; color:var(--text-dim);">Không tìm thấy kênh doanh nghiệp nào phù hợp.</div>`;
                return;
            }

            document.getElementById('display-grid').innerHTML = owners.map(b => {
                const avatar = b.businessData?.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(b.name)}&background=6366f1&color=fff&size=128`;
                const bio = b.businessData?.bio || `Đối tác chiến lược cung cấp ${b.places.length} trải nghiệm tinh hoa tại hệ thống WanderViệt.`;
                return `
                <div class="biz-card" onclick="window.location.href='business-profile.html?id=${b.id}'">
                    <img src="${avatar}" class="biz-logo" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(b.name)}&background=6366f1&color=fff&size=128';">
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <h3 style="font-size:1.8rem; font-weight:800; margin:0 0 8px;">${b.name}</h3>
                                <p style="color:var(--text-dim); font-size:14px; margin:0;">${bio}</p>
                            </div>
                            <button class="btn-search" style="padding:10px 24px;">TRUY CẬP KÊNH</button>
                        </div>
                        <div class="biz-ecosystem">
                            ${b.places.slice(0, 4).map(p => {
                                let fallbackImg = 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&q=80';
                                if (p.kind === 'khach-san') fallbackImg = 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600&q=80';
                                else if (p.kind === 'nha-hang' || p.kind === 'giai-tri') fallbackImg = 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&q=80';
                                else if (p.isTour || p.kind === 'trai-nghiem') fallbackImg = 'https://images.unsplash.com/photo-1533130061792-64b345e4a833?w=600&q=80';
                                const imgUrl = (p.images && p.images[0] && p.images[0].length > 5) ? p.images[0] : (p.image && p.image.length > 5 ? p.image : fallbackImg);
                                return `
                                <div class="eco-item" onclick="event.stopPropagation(); window.location.href='place-detail.html?id=${p._id || p.id}'">
                                    <img src="${imgUrl}" onerror="this.onerror=null;this.src='${fallbackImg}';">
                                    <div style="overflow:hidden;">
                                        <b style="font-size:12px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.name}</b>
                                        <span style="font-size:9px; color:var(--primary); font-weight:800;">${(p.price || p.priceFrom || 0).toLocaleString('vi-VN')} ₫</span>
                                    </div>
                                </div>
                                `}).join('')}
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        window.onload = init;
    </script>
</body>
</html>
