<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

    <!-- WanderViet Translation Curtain -->
    <script>
      if (document.cookie.match(/googtrans=\/vi\/(?!vi)[a-zA-Z-]+/)) {
        document.documentElement.classList.add('translating-curtain');
      }
    </script>
    <style>
      html.translating-curtain::before {
        content: "Translating Experience...";
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #0f172a; color: #f1f5f9;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999999; font-family: sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 1px;
      }
      html.translating-curtain body {
        opacity: 0 !important;
        pointer-events: none !important;
      }
      html.translated-ltr::before, html.translated-rtl::before {
        display: none !important;
      }
      html.translated-ltr body, html.translated-rtl body {
        opacity: 1 !important;
        pointer-events: auto !important;
        transition: opacity 0.4s ease;
      }
    </style>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ Doanh nghiệp — WanderViet AI</title>
    <link rel="icon" type="image/png" href="/assets/wanderviet-logo-cropped-rounded.png">
    <link rel="stylesheet" href="css/global-tokens.css?v=47" />
    <link rel="stylesheet" href="css/styles.css?v=47" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg-system: #060912;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        html[data-theme="light"] body {
            --bg-system: #f8fafc;
            --text-main: #0f172a;
            --text-dim: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg-system); color: var(--text-main); margin: 0; transition: background 0.4s; }

        .profile-banner {
            height: 400px; background: linear-gradient(135deg, #1e293b, #0f172a);
            position: relative; overflow: hidden;
        }
        .profile-banner img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-system), transparent); }

        .profile-header {
            max-width: 1200px; margin: -100px auto 0; position: relative; z-index: 10;
            display: flex; gap: 40px; align-items: flex-end; padding: 0 40px;
        }
        .profile-logo {
            width: 200px; height: 200px; border-radius: 48px; border: 8px solid var(--bg-system);
            background: var(--primary); box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center; font-size: 5rem; font-weight: 800; color: #fff;
        }

        .header-info { flex: 1; padding-bottom: 20px; }
        .biz-name { font-family: 'Plus Jakarta Sans'; font-size: 3rem; font-weight: 800; margin: 0 0 12px; letter-spacing: -1.5px; }
        
        .action-bar { display: flex; gap: 16px; }
        .btn-follow {
            background: var(--primary); color: #fff; border: none; padding: 14px 32px;
            border-radius: 18px; font-weight: 800; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(99,102,241,0.3);
        }
        .btn-follow.active { background: var(--glass-bg); color: var(--text-main); border: 1px solid var(--glass-border); }

        .profile-layout {
            max-width: 1200px; margin: 60px auto; padding: 0 40px;
            display: grid; grid-template-columns: 350px 1fr; gap: 60px;
        }

        .info-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 32px; padding: 32px; margin-bottom: 32px; }
        .info-title { font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; display: block; }

        .service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .s-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 28px;
            overflow: hidden; transition: 0.4s; cursor: pointer;
        }
        .s-card:hover { transform: translateY(-8px); border-color: var(--primary); }
        .s-img { height: 200px; }
        .s-img img { width: 100%; height: 100%; object-fit: cover; }
        .s-body { padding: 24px; }

    </style>
</head>
<body>
    <header id="header-container"></header>

    <div class="profile-banner">
        <img id="biz-banner" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=2070">
        <div class="banner-overlay"></div>
    </div>

    <div class="profile-header">
        <div class="profile-logo" id="biz-logo">WV</div>
        <div class="header-info">
            <h1 class="biz-name" id="biz-name">Đang tải...</h1>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="display:flex; gap:32px; color:var(--text-dim); font-weight:700;">
                    <span>🌟 <b style="color:var(--text-main);" id="biz-rating">0.0</b> <span style="font-weight: normal;">(<span id="biz-review-count">0</span> đánh giá)</span></span>
                    <span>👥 <b style="color:var(--text-main);" id="biz-followers">0</b> Theo dõi</span>
                    <span>📍 <b style="color:var(--text-main);" id="biz-loc">Việt Nam</b></span>
                </div>
                <div class="action-bar">
                    <button class="btn-follow" id="follow-btn" onclick="toggleFollow()">+ THEO DÕI</button>
                    <button id="btn-support" style="background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--text-main); padding:14px; border-radius:18px; cursor:pointer;" onclick="openSupport()">✉️</button>
                </div>
            </div>
        </div>
    </div>

    <main class="profile-layout">
        <aside>
            <div class="info-card">
                <span class="info-title">Giới thiệu</span>
                <p id="biz-desc" style="color:var(--text-dim); line-height:1.7; font-size:15px;">Doanh nghiệp đối tác chiến lược của WanderViet AI, chuyên cung cấp các dịch vụ du lịch và nghỉ dưỡng cao cấp.</p>
            </div>
            <div class="info-card">
                <span class="info-title">Thông tin liên hệ</span>
                <div id="biz-contact" style="display:flex; flex-direction:column; gap:16px; font-size:14px;">
                    <div>📧 <span id="biz-email">Đang tải...</span></div>
                    <div>📞 <span id="biz-phone">Đang tải...</span></div>
                    <div>🌐 <span id="biz-web">Đang tải...</span></div>
                </div>
            </div>
        </aside>

        <section>
            <h3 style="font-family:'Plus Jakarta Sans'; font-size:1.8rem; margin:0 0 32px;">Hệ sinh thái dịch vụ</h3>
            <div class="service-grid" id="svc-grid">
                <!-- Data will load here -->
            </div>
        </section>
    </main>

    <footer id="footer-container"></footer>
    <script src="js/SharedUI.js?v=1778494999999"></script>
    <script>
        const observer = new MutationObserver(() => {
            const t = document.documentElement.getAttribute('data-theme') || 'dark';
            document.body.setAttribute('data-theme', t);
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        const params = new URLSearchParams(window.location.search);
        const ownerName = params.get('name');
        const ownerId = params.get('id');
        let currentBizId = ownerId || ownerName;
        let isFollowing = false;

        function getFollowKey() {
            return `wv_follow_${currentBizId}`;
        }

        function updateFollowBtn() {
            const btn = document.getElementById('follow-btn');
            isFollowing = localStorage.getItem(getFollowKey()) === 'true';
            btn.innerText = isFollowing ? '✓ ĐANG THEO DÕI' : '+ THEO DÕI';
            btn.classList.toggle('active', isFollowing);
        }

        async function toggleFollow() {
            const token = localStorage.getItem('wander_token');
            if (!token) {
                if(window.WanderUI && window.WanderUI.showToast) window.WanderUI.showToast('Vui lòng đăng nhập để theo dõi');
                return;
            }
            try {
                const res = await fetch('/api/social/business/follow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
                    body: JSON.stringify({ businessId: currentBizId })
                });
                const json = await res.json();
                if (json.success) {
                    isFollowing = json.following;
                    localStorage.setItem(getFollowKey(), isFollowing);
                    
                    const btn = document.getElementById('follow-btn');
                    btn.innerText = isFollowing ? '✓ ĐANG THEO DÕI' : '+ THEO DÕI';
                    btn.classList.toggle('active', isFollowing);
                    
                    const followersEl = document.getElementById('biz-followers');
                    let count = parseInt(followersEl.innerText.replace(/\D/g, '')) || 0;
                    if (isFollowing) count++; else count--;
                    followersEl.innerText = count.toLocaleString('vi-VN');

                    const name = document.getElementById('biz-name').innerText;
                    if(window.WanderUI && window.WanderUI.showToast) {
                        window.WanderUI.showToast(isFollowing ? `Đã theo dõi ${name}` : `Đã bỏ theo dõi ${name}`);
                    }
                }
            } catch (err) {
                console.error('Follow error:', err);
            }
        }

        function openSupport() {
            const name = document.getElementById('biz-name').innerText;
            window.location.href = `feedback.html?tab=business&bizId=${currentBizId}&bizName=${encodeURIComponent(name)}`;
        }

        async function load() {
            try {
                let biz = null;
                let places = [];

                if (ownerId) {
                    const res = await fetch(`/api/public/business/${ownerId}/full`);
                    const json = await res.json();
                    if (json.success) {
                        biz = json.data.profile;
                        places = json.data.services || [];
                    } else if (json.message === 'Doanh nghiệp không tồn tại') {
                        // Fallback: This ownerId might just be attached to Places directly without a BusinessAccount
                        let pRes = await fetch(`/api/public/places?ownerId=${ownerId}`);
                        let pJson = await pRes.json();
                        let foundPlaces = pJson.success ? pJson.data : [];

                        if (foundPlaces.length === 0) {
                            // If still nothing, it might literally be the Place ID itself
                            const singleRes = await fetch(`/api/public/place/${ownerId}`);
                            const singleJson = await singleRes.json();
                            if (singleJson.success && singleJson.data) {
                                foundPlaces = [singleJson.data];
                            }
                        }

                        if (foundPlaces.length > 0) {
                            const p = foundPlaces[0];
                            const isSystem = foundPlaces.length > 1 || (p.ownerId && p.ownerId.startsWith('BIZ-'));
                            
                            biz = {
                                _id: p.ownerId || p._id,
                                id: p.ownerId || p.id || p._id,
                                name: isSystem ? 'WanderViet AI Partner' : (p.ownerName || p.name),
                                displayName: isSystem ? 'WanderViet AI Partner' : (p.ownerName || p.name),
                                avatar: isSystem ? 'https://ui-avatars.com/api/?name=WanderVi%E1%BB%87t+Partner&background=6366f1&color=fff&size=256' : (p.image || p.coverImage || (p.images && p.images[0])),
                                description: isSystem ? `Đối tác chiến lược cung cấp ${foundPlaces.length} trải nghiệm tinh hoa tại hệ thống WanderViet AI.` : (p.description || p.snippet),
                                email: p.contactEmail,
                                phone: p.contactPhone,
                                website: p.website
                            };
                            places = foundPlaces;
                        }
                    }
                }

                if (!biz && ownerName) {
                    const res = await fetch('/api/public/businesses');
                    const json = await res.json();
                    if (json.success) {
                        const found = json.data.find(b => (b.displayName || b.name) === ownerName);
                        if (found) {
                            // Gọi endpoint /full để lấy đầy đủ thông tin và danh sách dịch vụ
                            const fRes = await fetch(`/api/public/business/${found._id || found.id || found.customId}/full`);
                            const fJson = await fRes.json();
                            if (fJson.success) {
                                biz = fJson.data.profile;
                                places = fJson.data.services || [];
                            } else {
                                biz = found;
                                // Fallback nếu /full lỗi
                                const pRes = await fetch(`/api/public/places?ownerId=${found._id || found.id || found.customId}`);
                                const pJson = await pRes.json();
                                places = pJson.success ? pJson.data : [];
                            }
                        }
                    }
                }

                if (!biz) {
                    document.getElementById('biz-name').innerText = "Không tìm thấy doanh nghiệp";
                    return;
                }

                // Render Profile
                currentBizId = biz._id || biz.id || biz.customId || currentBizId;
                updateFollowBtn();
                
                const name = biz.displayName || biz.name;
                document.title = name + ' - WanderViet AI';
                document.getElementById('biz-name').innerText = name;
                document.getElementById('biz-logo').innerText = name.charAt(0).toUpperCase();
                if (biz.avatar) {
                    document.getElementById('biz-logo').innerHTML = `<img src="${biz.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`;
                }
                
                // Check follow state from server
                const token = localStorage.getItem('wander_token');
                if (token && currentBizId) {
                    try {
                        const followRes = await fetch(`/api/social/business/check-follow/${currentBizId}`, {
                            headers: { 'x-auth-token': token }
                        });
                        const followJson = await followRes.json();
                        if (followJson.success) {
                            isFollowing = followJson.following;
                            localStorage.setItem(getFollowKey(), isFollowing);
                        }
                    } catch (e) {}
                }
                updateFollowBtn();
                
                let avgRating = 5.0;
                let realReviewCount = 0;
                if (places.length > 0) {
                    const ratings = places.map(p => parseFloat(p.ratingAvg || p.rating || 0)).filter(r => r > 0);
                    if (ratings.length > 0) {
                        avgRating = (ratings.reduce((a,b) => a+b, 0) / ratings.length).toFixed(1);
                    }
                    realReviewCount = places.reduce((sum, p) => sum + (p.reviewCount || 0), 0); 
                }

                document.getElementById('biz-rating').innerText = biz.rating || avgRating;
                const reviewCountEl = document.getElementById('biz-review-count');
                if (reviewCountEl) reviewCountEl.innerText = realReviewCount.toLocaleString('vi-VN');
                
                const realFollowers = biz.followersCount || biz.followers || 0;
                document.getElementById('biz-followers').innerText = realFollowers.toLocaleString('vi-VN');
                
                if (biz.notes || biz.description) {
                    document.getElementById('biz-desc').innerText = biz.notes || biz.description;
                }
                
                document.getElementById('biz-email').innerText = biz.email || 'contact@wanderviet.vn';
                document.getElementById('biz-phone').innerText = biz.phone || '+84 123 456 789';
                document.getElementById('biz-web').innerText = biz.website || 'www.wanderviet.vn';

                // Save email to global for the support button
                window.currentBizEmail = biz.email || 'contact@wanderviet.vn';

                // Render Services
                const grid = document.getElementById('svc-grid');
                if (places.length === 0) {
                    grid.innerHTML = '<p style="color:var(--text-dim); grid-column: 1/-1; text-align:center; padding:40px;">Doanh nghiệp chưa có dịch vụ nào.</p>';
                } else {
                    grid.innerHTML = places.map(p => `
                        <div class="s-card" onclick="window.location.href='place-detail.html?id=${p._id || p.id}'">
                            <div class="s-img"><img src="${p.image || 'assets/img/place-placeholder.jpg'}"></div>
                            <div class="s-body">
                                <span style="color:var(--primary); font-size:10px; font-weight:800; letter-spacing:2px; display:block; margin-bottom:8px;">${p.kind || 'DỊCH VỤ'}</span>
                                <h4 style="margin:0 0 8px; font-size:1.1rem; font-weight:800;">${p.name}</h4>
                                <b style="color:var(--text-main);">${(p.priceFrom || 0).toLocaleString()} ₫</b>
                            </div>
                        </div>
                    `).join('');
                    
                    document.getElementById('biz-loc').innerText = biz.address || places[0].region || 'Việt Nam';
                    document.getElementById('biz-banner').src = places[0].image || document.getElementById('biz-banner').src;
                }
            } catch(e) {
                console.error("Load business error:", e);
                document.getElementById('biz-name').innerText = "Lỗi tải dữ liệu";
            }
        }
        window.onload = load;
    </script>
</body>
</html>
