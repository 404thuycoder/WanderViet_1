    <div class="controls">

            <!-- NÃºt Láº¥y vá»‹ trÃ­ hiá»‡n táº¡i -->

        <input type="text" id="dest-input" placeholder="Nháº­p Ä‘iá»ƒm Ä‘áº¿n (VD: Há»“ GÆ°Æ¡m, HÃ  Ná»™i)" />

            <label><input type="radio" name="mode" value="driving" checked>ðŸš— Ã” tÃ´ / Xe mÃ¡y</label>

<!-- 2. Táº£i JavaScript cá»§a thÆ° viá»‡n Báº£n Ä‘á»“ Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js?v=1776819067181" crossorigin=""></script>

<!-- MÃƒ Lá»†NH JAVASCRIPT GIAO TIáº¾P Vá»šI Báº¢N Äá»’ -->
<script>
    // ===================================================================
    // PHáº¦N 1: KHá»žI Táº O Báº¢N Äá»’
    // ===================================================================
    
    // Táº¡o báº£n Ä‘á»“ vÃ  Ä‘áº·t vá»‹ trÃ­ máº·c Ä‘á»‹nh á»Ÿ giá»¯a Viá»‡t Nam (VÄ© Ä‘á»™ 16.04, Kinh Ä‘á»™ 108.20)
    let map = L.map('map').setView([16.04, 108.20], 5);

    // DÃ¹ng hÃ¬nh áº£nh báº£n Ä‘á»“ tá»« OpenStreetMap (Miá»…n phÃ­ 100%)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: 'Â© OpenStreetMap contributors'
    }).addTo(map);

    // Cáº¥p phÃ¡t cÃ¡c biáº¿n toÃ n cá»¥c Ä‘á»ƒ lÆ°u Marker vÃ  ÄÆ°á»ng bá»™
    let routeLayer = null;
    let originMarker = null;
    let destMarker = null;
    
    // Biáº¿n lÆ°u giá»¯ tá»a Ä‘á»™ thá»±c cá»§a ngÆ°á»i dÃ¹ng (náº¿u cÃ³ báº¥m 'Láº¥y vá»‹ trÃ­')
    let userCurrentLat = null;
    let userCurrentLon = null;

    // ===================================================================
    // PHáº¦N 2: Láº¤Y Vá»Š TRÃ HIá»†N Táº I (GEOLOCATION API)
    // ===================================================================
    function getMyLocation() {
        const statusMsg = document.getElementById('status-msg');
        
        // Kiá»ƒm tra trÃ¬nh duyá»‡t cÃ³ há»— trá»£ GPS khÃ´ng
        if (!navigator.geolocation) {
            statusMsg.innerText = "TrÃ¬nh duyá»‡t cá»§a báº¡n khÃ´ng há»— trá»£ Ä‘á»‹nh vá»‹.";
            return;
        }

        statusMsg.innerText = "Äang tÃ¬m vá»‹ trÃ­ cá»§a báº¡n... (HÃ£y chá»n Cho phÃ©p)";

        // Gá»i API yÃªu cáº§u tá»a Ä‘á»™
        navigator.geolocation.getCurrentPosition(
            (position) => {
                userCurrentLat = position.coords.latitude;
                userCurrentLon = position.coords.longitude;

                // Äiá»n chá»¯ vÃ o Ã´ input Ä‘á»ƒ ng dÃ¹ng biáº¿t Ä‘Ã£ láº¥y thÃ nh cÃ´ng
                document.getElementById('origin-input').value = "ðŸ“ Vá»‹ trÃ­ hiá»‡n táº¡i cá»§a tÃ´i";
                statusMsg.innerText = "ÄÃ£ láº¥y Ä‘Æ°á»£c vá»‹ trÃ­! HÃ£y nháº­p Äiá»ƒm Ä‘áº¿n vÃ  TÃ¬m Ä‘Æ°á»ng.";
            },
            (error) => {
                console.error("Lá»—i Geolocation:", error);
                let reason = "ChÆ°a rÃµ nguyÃªn nhÃ¢n.";
                if (error.code === 1) reason = "Báº¡n Ä‘Ã£ Chá»n BLOCK (Tá»« chá»‘i Ä‘á»‹nh vá»‹) trÃªn trÃ¬nh duyá»‡t.";
                if (error.code === 2) reason = "Thiáº¿t bá»‹ khÃ´ng cÃ³ tÃ­n hiá»‡u GPS hoáº·c máº¡ng ngáº¯t káº¿t ná»‘i.";
                if (error.code === 3) reason = "TÃ­nh nÄƒng láº¥y vá»‹ trÃ­ bá»‹ quÃ¡ háº¡n (Timeout).";
                
                // TrÆ°á»ng há»£p Ä‘áº·c biá»‡t (Tuyá»‡t Ä‘á»‘i quan trá»ng khi cáº¥u hÃ¬nh cho sinh viÃªn):
                if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                    reason += " Báº¯t buá»™c pháº£i cháº¡y dÃ¹ng link http://localhost (hoáº·c HTTPS). TrÃ¬nh duyá»‡t cháº·n GPS Ä‘á»‘i vá»›i IP áº£o http://192.168.x.x!";
                }

                statusMsg.innerHTML = "<strong>âŒ Lá»—i láº¥y vá»‹ trÃ­:</strong> " + reason;
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    // ===================================================================
    // PHáº¦N 3: TÃŒM ÄÆ¯á»œNG VÃ€ Váº¼ LÃŠN Báº¢N Äá»’
    // ===================================================================
    async function calculateRoute() {
        const originInput = document.getElementById('origin-input').value.trim();
        const destInput = document.getElementById('dest-input').value.trim();
        const statusMsg = document.getElementById('status-msg');
        const infoBox = document.getElementById('info-box');

        if (!originInput || !destInput) {
            statusMsg.innerText = "Vui lÃ²ng nháº­p Ä‘áº§y Ä‘á»§ gá»‘c vÃ  Ä‘Ã­ch!";
            return;
        }

        statusMsg.innerText = "Äang phÃ¢n tÃ­ch Ä‘á»‹a chá»‰...";
        infoBox.style.display = 'none';

        try {
            // --- BÆ¯á»šC A: Äá»•i chá»¯ viáº¿t (Ä‘á»‹a chá»‰) thÃ nh Tá»a Ä‘á»™ Kinh/VÄ© (Geocoding) ---
            let startCoords = {};
            
            // Náº¿u ngÆ°á»i dÃ¹ng Ä‘ang xÃ i "Vá»‹ trÃ­ hiá»‡n táº¡i", ta Æ°u tiÃªn láº¥y tá»a Ä‘á»™ gá»‘c Ä‘Ã£ lÆ°u
            if (originInput === "ðŸ“ Vá»‹ trÃ­ hiá»‡n táº¡i cá»§a tÃ´i" && userCurrentLat !== null) {
                startCoords = { lat: userCurrentLat, lon: userCurrentLon };
            } else {
                // Náº¿u ngÆ°á»i dÃ¹ng gÃµ chá»¯ (VÃ­ dá»¥: "HÃ  Ná»™i"), gá»i API chuyá»ƒn Ä‘á»•i sang gá»‘c
                startCoords = await textToCoords(originInput);
            }

            // Gá»i API Ä‘á»•i chá»¯ thÃ nh Tá»a Ä‘á»™ ÄÃ­ch
            const endCoords = await textToCoords(destInput);

            if (!startCoords || !endCoords) {
                statusMsg.innerText = "KhÃ´ng thá»ƒ tÃ¬m tháº¥y tá»a Ä‘á»™ Ä‘á»‹a danh nÃ y trÃªn báº£n Ä‘á»“.";
                return;
            }

            // --- BÆ¯á»šC B: Láº¥y phÆ°Æ¡ng tiá»‡n di chuyá»ƒn Ä‘ang chá»n ---
            const mode = document.querySelector('input[name="mode"]:checked').value;
            
            statusMsg.innerText = "Äang tÃ­nh toÃ¡n tuyáº¿n Ä‘Æ°á»ng tá»‘i Æ°u...";

            // --- BÆ¯á»šC C: Gá»i API Äiá»u hÆ°á»›ng (OSRM) Ä‘á»ƒ láº¥y máº£ng tá»a Ä‘á»™ váº½ Ä‘Æ°á»ng ---
            // Nguá»“n: router.project-osrm.org/v1/{phÆ°Æ¡ng_tiá»‡n}/{KinhÄá»™1},{VÄ©Äá»™1};{KinhÄá»™2},{VÄ©Äá»™2}
            const url = `https://router.project-osrm.org/route/v1/${mode}/${startCoords.lon},${startCoords.lat};${endCoords.lon},${endCoords.lat}?overview=full&geometries=geojson`;
            
            const response = await fetch(url);
            const data = await response.json();

            if (data.code !== 'Ok' || data.routes.length === 0) {
                statusMsg.innerText = "KhÃ´ng tÃ¬m tháº¥y con Ä‘Æ°á»ng bá»™ nÃ o ná»‘i hai Ä‘iá»ƒm nÃ y.";
                return;
            }

            // --- BÆ¯á»šC D: Váº½ Ä‘Æ°á»ng lÃªn báº£n Ä‘á»“ (Leaflet Layer) ---
            const routeConfig = data.routes[0];
            
            // 1. Dá»n dáº¹p báº£n Ä‘á»• cÅ©
            if (routeLayer) map.removeLayer(routeLayer);
            if (originMarker) map.removeLayer(originMarker);
            if (destMarker) map.removeLayer(destMarker);

            // 2. Gom máº£ng Ä‘Æ°á»ng tháº³ng (Geojson) váº½ má»±c mÃ u xanh
            routeLayer = L.geoJSON(routeConfig.geometry, {
                style: { color: '#ef4444', weight: 6, opacity: 0.8 }
            }).addTo(map);

            // 3. ÄÃ¡nh dáº¥u Äinh ghim hai Ä‘áº§u
            originMarker = L.marker([startCoords.lat, startCoords.lon]).addTo(map).bindPopup("Xuáº¥t PhÃ¡t").openPopup();
            destMarker = L.marker([endCoords.lat, endCoords.lon]).addTo(map).bindPopup("Äiá»ƒm Äáº¿n");

            // 4. KÃ©o mÃ n hÃ¬nh bao phá»§ láº¥y toÃ n bá»™ Ä‘Æ°á»ng Ä‘i
            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

            // --- BÆ¯á»šC E: Hiá»‡n thÃ´ng sá»‘ QuÃ£ng Ä‘Æ°á»ng, Thá»i gian ---
            document.getElementById('distance').innerText = (routeConfig.distance / 1000).toFixed(1) + ' km';
            document.getElementById('duration').innerText = Math.round(routeConfig.duration / 60) + ' phÃºt';
            infoBox.style.display = 'block';
            statusMsg.innerText = ""; // XÃ³a lá»—i hiá»‡n táº¡i

        } catch (error) {
            console.error(error);
            statusMsg.innerText = "ÄÃ£ xáº£y ra lá»—i há»‡ thá»‘ng khi tÃ­nh toÃ¡n.";
        }
    }

    // ===================================================================
    // HÃ€M Bá»” TRá»¢: Chuyá»ƒn Äá»‹a chá»‰ Chá»¯ -> Tá»a Ä‘á»™ (DÃ¹ng API Nominatim cá»§a OSM)
    // ===================================================================
    async function textToCoords(address) {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ', Vietnam')}&limit=1`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data.length > 0) {
            return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        }
        return null; // KhÃ´ng tÃ¬m ra
    }
</script>
