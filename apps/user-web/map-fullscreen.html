<body style="padding-top: 60px;">

    <!-- Khung Báº£n Äá»“ ToÃ n MÃ n HÃ¬nh -->

    <div class="search-box">

    <!-- 2. Náº¡p ThÆ° viá»‡n Báº£n Ä‘á»“ Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js?v=1776819067181" crossorigin=""></script>
    <script src="js/SharedUI.js?v=1778494999999"></script>

    <!-- MÃƒ ÄIá»€U KHIá»‚N CHÃNH (LOGIC APP) -->
    <script>
        // ==========================================
        // 1. KHá»žI Táº O Báº¢N Äá»’
        // ==========================================
        
        // Táº¡o map vÃ  set tÃ¢m máº·c Ä‘á»‹nh vÃ o HÃ  Ná»™i, Ä‘á»™ zoom 6 (Ä‘á»ƒ tháº¥y toÃ n quá»‘c)
        let map = L.map('map', { zoomControl: false }).setView([21.0285, 105.8542], 6);

        // ThÃªm nÃºt zoom xuá»‘ng gÃ³c pháº£i dÆ°á»›i (cho Ä‘á»¡ vÆ°á»›ng nÃºt search)
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Nguá»“n dá»¯ liá»‡u báº£n Ä‘á»“: OpenStreetMap (CÃ³ báº£n quyá»n Ä‘áº§y Ä‘á»§, miá»…n phÃ­)
        // Dá»¯ liá»‡u OSM quá»‘c táº¿ máº·c Ä‘á»‹nh ghi nháº­n Ä‘áº§y Ä‘á»§ Quáº§n Ä‘áº£o HoÃ ng Sa, TrÆ°á»ng Sa cá»§a Viá»‡t Nam
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: 'Â© OpenStreetMap contributors | Dá»¯ liá»‡u bao trÃ¹m lÃ£nh thá»• VN'
        }).addTo(map);

        // CÃ¡c biáº¿n toÃ n cá»¥c
        let myCurrentLat = null;
        let myCurrentLon = null;
        let watchId = null; // Quáº£n lÃ½ ID quÃ©t vá»‹ trÃ­ thá»i gian thá»±c

        let myMarker = null;       // Äinh ghim vá»‹ trÃ­ "TÃ´i"
        let targetMarker = null;   // Äinh ghim Ä‘iá»ƒm "Äáº¿n"
        let routePolyline = null;  // ÄÆ°á»ng mÃ u xanh váº½ trÃªn báº£n Ä‘á»“

        // Icon cháº¥m xanh nÆ°á»›c biá»ƒn (Pulse radar) cho vá»‹ trÃ­ cá»§a tÃ´i
        const userIcon = L.divIcon({
            className: 'custom-div-icon',
            html: '<div class="pulse-marker"></div>',
            iconSize: [15, 15],
            iconAnchor: [7.5, 7.5]
        });

        // ==========================================
        // 2. Láº¤Y Vá»Š TRÃ THEO THá»œI GIAN THá»°C (AUTO TRACKING)
        // ==========================================
        
        function startTrackingLocation() {
            if (!navigator.geolocation) {
                document.getElementById('status-msg').innerText = "TrÃ¬nh duyá»‡t khÃ´ng há»— trá»£ Geolocation (Äá»‹nh vá»‹).";
                return;
            }

            let isFirstLoad = true;

            // Lá»‡nh watchPosition: Tá»± Ä‘á»™ng cháº¡y láº¡i hÃ m má»—i khi ngÆ°á»i dÃ¹ng di chuyá»ƒn sang tá»a Ä‘á»™ má»›i
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    myCurrentLat = position.coords.latitude;
                    myCurrentLon = position.coords.longitude;

                    // Náº¿u lÃ  láº§n Ä‘áº§u má»Ÿ trang, tá»± Ä‘á»™ng di chuyá»ƒn báº£n Ä‘á»“ (focus) vÃ o vá»‹ trÃ­ cá»§a tÃ´i
                    if (isFirstLoad) {
                        isFirstLoad = false;
                        document.getElementById('origin-input').value = `ÄÃ£ láº¥y vá»‹ trÃ­ GPS thÃ nh cÃ´ng âœ”`;
                        map.setView([myCurrentLat, myCurrentLon], 15); // Zoom vÃ o gáº©n
                    }

                    // Cáº­p nháº­t vá»‹ trÃ­ cÃ¡i Äinh ghim trÃªn báº£n Ä‘á»“ liÃªn tá»¥c
                    if (!myMarker) {
                        myMarker = L.marker([myCurrentLat, myCurrentLon], {icon: userIcon, zIndexOffset: 1000})
                            .addTo(map)
                            .bindPopup("Vá»‹ trÃ­ hiá»‡n táº¡i cá»§a báº¡n");
                    } else {
                        myMarker.setLatLng([myCurrentLat, myCurrentLon]);
                    }
                },
                (error) => {
                    let errMsg = "Bá»‹ tá»« chá»‘i quyá»n truy cáº­p Vá»‹ trÃ­.";
                    if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
                        errMsg += " (Báº¯t buá»™c dÃ¹ng HTTPS thay vÃ¬ HTTP)";
                    }
                    document.getElementById('status-msg').innerText = "âŒ Lá»—i: " + errMsg;
                    document.getElementById('origin-input').value = "TrÃ¬nh duyá»‡t cháº·n láº¥y vá»‹ trÃ­!";
                },
                { enableHighAccuracy: true, maximumAge: 0 } // YÃªu cáº§u GPS Ä‘á»™ nháº¡y cao nháº¥t
            );
        }

        // Báº¯t Ä‘áº§u cháº¡y quÃ©t GPS ngay khi vá»«a load web xong
        window.onload = startTrackingLocation;

        // Xá»­ lÃ½ nÃºt "Focus vá»‹ trÃ­ cá»§a tÃ´i"
        function centerToMyLocation() {
            if (myCurrentLat && myCurrentLon) {
                map.flyTo([myCurrentLat, myCurrentLon], 16, { duration: 1 });
            } else {
                alert("Há»‡ thá»‘ng chÆ°a quÃ©t Ä‘Æ°á»£c vá»‹ trÃ­ cá»§a báº¡n. HÃ£y báº­t GPS.");
            }
        }


        // ==========================================
        // 3. Xá»¬ LÃ TÃŒM ÄÆ¯á»œNG VÃ€ Váº¼ LÃŠN Báº¢N Äá»’
        // ==========================================
        
        async function calculateRoute() {
            const destText = document.getElementById('dest-input').value.trim();
            const statusBox = document.getElementById('status-msg');
            
            if (!myCurrentLat || !myCurrentLon) {
                statusBox.innerText = "âŒ ChÆ°a cÃ³ tá»a Ä‘á»™ báº¯t Ä‘áº§u. HÃ£y chá» GPS xÃ¡c nháº­n vá»‹ trÃ­ hoáº·c cáº¥p quyá»n.";
                return;
            }
            if (!destText) {
                statusBox.innerText = "âŒ Báº¡n chÆ°a nháº­p má»¥c Ä‘Ã­ch Ä‘áº¿n kÃ¬a!";
                return;
            }

            // XÃ³a lá»—i Ä‘ang hiá»‡n
            statusBox.innerText = "Äang tra cá»©u dá»¯ liá»‡u Ä‘á»‹a Ä‘iá»ƒm...";
            document.getElementById('route-info').style.display = 'none';

            try {
                // A) Äá»•i chá»¯ cá»§a ngÆ°á»i dÃ¹ng thÃ nh Tá»a Ä‘á»™ (API Nominatim - Miá»…n phÃ­)
                const textToCoordUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destText + ', Vietnam')}&limit=1`;
                const addressFetch = await fetch(textToCoordUrl);
                const addressData = await addressFetch.json();

                if (!addressData || addressData.length === 0) {
                    statusBox.innerText = "âŒ KhÃ´ng tÃ¬m tháº¥y vÃ¹ng Ä‘áº¥t nÃ y trÃªn báº£n Ä‘á»“. GÃµ cÃ³ dáº¥u xem sao nhÃ©.";
                    return;
                }

                const targetLat = parseFloat(addressData[0].lat);
                const targetLon = parseFloat(addressData[0].lon);

                // Tháº£ Marker Äiá»ƒm Äáº¿n
                if (targetMarker) map.removeLayer(targetMarker);
                targetMarker = L.marker([targetLat, targetLon]).addTo(map).bindPopup("<b>Äiá»ƒm Äáº¿n</b><br/>" + addressData[0].display_name).openPopup();

                // B) Láº¥y cháº¿ Ä‘á»™ Ä‘i phÆ°Æ¡ng tiá»‡n nÃ o
                const mode = document.querySelector('input[name="mode"]:checked').value;
                statusBox.innerText = "Äang tÃ­nh toÃ¡n tuyáº¿n Ä‘Æ°á»ng ngáº¯n nháº¥t...";

                // C) Xin Ä‘Æ°á»ng Ä‘i tá»« tráº¡m phÃ¡t sÃ³ng Ä‘á»‹nh tuyáº¿n OpenRouteService / OSRM (Miá»…n phÃ­)
                // OSRM: https://router.project-osrm.org/route/v1/{mode}/{lon1},{lat1};{lon2},{lat2}
                const routeUrl = `https://router.project-osrm.org/route/v1/${mode}/${myCurrentLon},${myCurrentLat};${targetLon},${targetLat}?overview=full&geometries=geojson`;
                
                const routeRes = await fetch(routeUrl);
                const routeJson = await routeRes.json();

                if (routeJson.code !== 'Ok' || routeJson.routes.length === 0) {
                     statusBox.innerText = "âŒ MÃ¡y chá»§ khÃ´ng tÃ¬m ra Ä‘Æ°á»£c con Ä‘Æ°á»ng kháº£ thi nÃ o (Qua sÃ´ng/biá»ƒn/Ä‘áº£o...).";
                     return;
                }

                // D) Táº©y Ä‘Æ°á»ng bay cÅ© vÃ  Váº½ Ä‘Æ°á»ng bay má»›i lÃªn
                if (routePolyline) map.removeLayer(routePolyline);
                
                routePolyline = L.geoJSON(routeJson.routes[0].geometry, {
                    style: { color: '#0ea5e9', weight: 6, opacity: 0.9, lineCap: 'round', lineJoin: 'round' }
                }).addTo(map);

                // Zoom sao cho vá»«a khung nhÃ¬n tá»« A Ä‘áº¿n B
                map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });

                // E) Show káº¿t quáº£ Khoáº£ng cÃ¡ch, Thá»i gian
                const totalDistKm = (routeJson.routes[0].distance / 1000).toFixed(1);
                const rawMins = Math.round(routeJson.routes[0].duration / 60);

                // Format ra giá» náº¿u thá»i gian lá»›n hÆ¡n 60 p
                let timeText = rawMins + " phÃºt";
                if (rawMins > 60) {
                    timeText = Math.floor(rawMins / 60) + " giá» " + (rawMins % 60) + " phÃºt";
                }

                document.getElementById('dist-val').innerText = totalDistKm + " km";
                document.getElementById('time-val').innerText = timeText;
                
                document.getElementById('route-info').style.display = 'block';
                document.getElementById('reset-btn').style.display = 'block';
                statusBox.innerText = ""; // Dá»n sáº¡ch lá»—i

            } catch (error) {
                console.error("Lá»—i App:", error);
                // Do SV cháº¡y trÃªn mÃ´i trÆ°á»ng cÃ³ thiáº¿t láº­p máº¡ng kháº¯t khe (hoáº·c ngháº½n máº¡ng) sáº½ nháº£y lá»—i Fetch.
                statusBox.innerText = `âŒ Lá»—i Há»‡ Thá»‘ng: KhÃ´ng thá»ƒ táº£i. Kiá»ƒm tra máº¡ng hoáº·c Adblock! Chi tiáº¿t: ${error.message}`;
            }
        }

        // ==========================================
        // 4. RESET Báº¢N Äá»’
        // ==========================================
        function resetMap() {
            // XÃ³a Ä‘Æ°á»ng vÃ  Marker Ä‘iá»ƒm Ä‘áº¿n
            if (routePolyline) map.removeLayer(routePolyline);
            if (targetMarker) map.removeLayer(targetMarker);
            
            // XÃ³a input
            document.getElementById('dest-input').value = "";
            document.getElementById('route-info').style.display = 'none';
            document.getElementById('status-msg').innerText = "ÄÃ£ dá»n dáº¹p báº£n Ä‘á»“.";
            document.getElementById('reset-btn').style.display = 'none';

            // ÄÆ°a láº¡i tiÃªu Ä‘iá»ƒm vá» vá»‹ trÃ­ cá»§a tÃ´i
            centerToMyLocation();
        }

    </script>
